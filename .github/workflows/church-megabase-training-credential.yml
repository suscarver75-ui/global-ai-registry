name: Church Mega Base Training Credential Verify
on:
  push:
    paths: ["church/runtime/**",".github/workflows/church-megabase-training-credential.yml"]
  pull_request:
    paths: ["church/runtime/**",".github/workflows/church-megabase-training-credential.yml"]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python church/runtime/test-megabase-training-credential.py
      - run: python church/runtime/test-training-runtime.py
      - run: python church/runtime/test-credential-runtime.py
