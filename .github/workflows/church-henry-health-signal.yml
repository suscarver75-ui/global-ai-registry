name: Church Henry Health Signal Verify
on:
  push:
    paths: ["church/runtime/henry-health-signal.py","church/runtime/test-henry-health-signal.py",".github/workflows/church-henry-health-signal.yml"]
  pull_request:
    paths: ["church/runtime/henry-health-signal.py","church/runtime/test-henry-health-signal.py",".github/workflows/church-henry-health-signal.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile church/runtime/henry-health-signal.py church/runtime/test-henry-health-signal.py
      - run: python church/runtime/test-henry-health-signal.py
