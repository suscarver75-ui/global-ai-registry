name: Church Full Body E2E Verify
on:
  push:
    paths: ["church/runtime/**",".github/workflows/church-full-body-e2e.yml"]
  pull_request:
    paths: ["church/runtime/**",".github/workflows/church-full-body-e2e.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python church/runtime/test-full-body-e2e.py
