name: Church Operations Recovery Verify
on:
  push:
    paths: ["church/runtime/operations-recovery.py","church/runtime/test-operations-recovery.py",".github/workflows/church-operations-recovery.yml"]
  pull_request:
    paths: ["church/runtime/operations-recovery.py","church/runtime/test-operations-recovery.py",".github/workflows/church-operations-recovery.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile church/runtime/operations-recovery.py church/runtime/test-operations-recovery.py
      - run: python church/runtime/test-operations-recovery.py
