name: Henry Provenance Verify

on:
  push:
    paths:
      - 'henry/**'
      - '.github/workflows/henry-provenance-verify.yml'
  pull_request:
    paths:
      - 'henry/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-henry-public-layer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Henry provenance and public boundary
        run: python henry/verify-provenance.py
