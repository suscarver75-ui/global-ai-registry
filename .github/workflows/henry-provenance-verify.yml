name: Henry Provenance Verify

on:
  push:
    paths:
      - 'henry/**'
      - '.github/workflows/henry-provenance-verify.yml'
  pull_request:
    paths:
      - 'henry/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-henry-public-layer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Henry provenance and public boundary
        run: python henry/verify-provenance.py
      - name: Prove Henry fails closed on prohibited commands
        run: python henry/test-policy-engine.py
      - name: Prove Henry detects receipt-chain tampering
        run: python henry/receipts/test-chain.py
      - name: Prove Henry binds receipts to exact commands
        run: python henry/receipts/test-command-binding.py
      - name: Prove Henry enforces bounded-operation safety
        run: python henry/test-operation-guard.py
      - name: Prove Mac Henry to Henry end-to-end control flow
        run: python henry/control-proof-v1.py
      - name: Prove rollback and authority-promotion controls
        run: python henry/test-recovery-gate.py
      - name: Verify audit retention and failure-preservation policy
        run: python henry/audit-verify.py
      - name: Prove Henry authority remains preview-only
        run: python henry/verify-authority-state.py
      - name: Evaluate owner-facing manager readiness
        run: python henry/manager-readiness.py
      - name: Verify owner executive status
        run: python henry/owner-status.py
      - name: Verify department least-privilege boundaries
        run: python henry/departments/verify-department-contract.py
      - name: Prove department reports fail closed at routing boundary
        run: python henry/departments/test-report-router.py
      - name: Prove executive aggregation resolves competing department signals
        run: python henry/departments/test-executive-aggregator.py
      - name: Prove business decision engine ranks value, cost, risk and evidence
        run: python henry/test-decision-engine.py
      - name: Prove public outcome evidence binds to exact decisions without private learning authority
        run: python henry/outcomes/test-public-outcome-verifier.py
      - name: Prove private Mac Henry learning remains outside public Henry
        run: python henry/outcomes/verify-private-learning-boundary.py
      - name: Prove governed learning preserves evidence, versioning, rollback and owner approval
        run: python henry/outcomes/verify-learning-governance-contract.py
      - name: Prove evidence quality accounts for verification, recency, independence, contradictions and decay
        run: python henry/evidence/verify-evidence-quality-contract.py
      - name: Prove confidence requires sufficient current independent verified evidence
        run: python henry/evidence/test-confidence-gate.py
