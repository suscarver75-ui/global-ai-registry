name: Church Mega Base Protected Data Verify
on:
  push:
    paths: ["church/runtime/**","mega-base/**",".github/workflows/church-megabase-protected-data.yml"]
  pull_request:
    paths: ["church/runtime/**","mega-base/**",".github/workflows/church-megabase-protected-data.yml"]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python church/runtime/test-megabase-protected-data.py
      - run: python church/runtime/test-protected-data.py
      - run: python mega-base/test-core.py
