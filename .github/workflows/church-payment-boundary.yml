name: Church Payment Boundary Verify
on:
  push:
    paths: ["church/runtime/payment-boundary.py","church/runtime/test-payment-boundary.py",".github/workflows/church-payment-boundary.yml"]
  pull_request:
    paths: ["church/runtime/payment-boundary.py","church/runtime/test-payment-boundary.py",".github/workflows/church-payment-boundary.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile church/runtime/payment-boundary.py church/runtime/test-payment-boundary.py
      - run: python church/runtime/test-payment-boundary.py
