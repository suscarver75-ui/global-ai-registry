name: Sovereign Backend Foundation Verify
on:
  push:
    paths: ["mac-henry/backend/**",".github/workflows/sovereign-backend-verify.yml"]
  pull_request:
    paths: ["mac-henry/backend/**",".github/workflows/sovereign-backend-verify.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python mac-henry/backend/test-sovereign-backend.py
