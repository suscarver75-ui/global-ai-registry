name: Church Security Foundation Verify
on:
  push:
    paths:
      - 'church/security/**'
      - '.github/workflows/church-security-foundation.yml'
  pull_request:
    paths:
      - 'church/security/**'
      - '.github/workflows/church-security-foundation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile tests
        run: python -m py_compile church/security/test-security-foundation.py
      - name: Validate policy
        run: python -m json.tool church/security/security-foundation.json >/dev/null
      - name: Verify invariants
        run: python church/security/test-security-foundation.py
