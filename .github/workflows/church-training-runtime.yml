name: Church Training Runtime Verify
on:
  push:
    paths: ["church/runtime/training-runtime.py","church/runtime/test-training-runtime.py",".github/workflows/church-training-runtime.yml"]
  pull_request:
    paths: ["church/runtime/training-runtime.py","church/runtime/test-training-runtime.py",".github/workflows/church-training-runtime.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile church/runtime/training-runtime.py church/runtime/test-training-runtime.py
      - run: python church/runtime/test-training-runtime.py
