name: Church Charter Runtime Verify
on:
  push:
    paths: ["church/runtime/charter-runtime.py","church/runtime/test-charter-runtime.py",".github/workflows/church-charter-runtime.yml"]
  pull_request:
    paths: ["church/runtime/charter-runtime.py","church/runtime/test-charter-runtime.py",".github/workflows/church-charter-runtime.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile church/runtime/charter-runtime.py church/runtime/test-charter-runtime.py
      - run: python church/runtime/test-charter-runtime.py
